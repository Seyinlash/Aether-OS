<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>Aether OS</title>
<style>
  /* ==========================================================================
     AETHER OS - DESIGN TOKENS
     Palette: deep space-blue base, violet/blue glass accents.
     Type:    "Space Grotesk"  → system chrome (taskbar, clock, headings)
               "Inter"          → labels, body, menu text
     ========================================================================== */
  :root{
    --void-950: #06070d;
    --void-900: #0b0e18;
    --void-800: #121726;
    --void-700: #1b2136;
    --glass-fill: rgba(255,255,255,0.06);
    --glass-fill-strong: rgba(255,255,255,0.10);
    --glass-border: rgba(255,255,255,0.10);
    --glass-border-soft: rgba(255,255,255,0.06);

    --accent-violet: #8b6bff;
    --accent-blue: #4f8dff;
    --accent-grad: linear-gradient(135deg, var(--accent-blue), var(--accent-violet));
    --accent-grad-soft: linear-gradient(135deg, rgba(79,141,255,0.35), rgba(139,107,255,0.35));

    --text-hi: #eef0fb;
    --text-mid: #b7bcd6;
    --text-low: #767c9c;

    --danger: #ff6b7a;
    --ok: #5be3a6;

    --radius-sm: 8px;
    --radius-md: 14px;
    --radius-lg: 22px;

    --shadow-window: 0 20px 60px rgba(0,0,0,0.45);
    --shadow-soft: 0 8px 30px rgba(0,0,0,0.35);

    --blur-glass: 22px;

    --ease-out: cubic-bezier(.16,1,.3,1);
    --dur-fast: 140ms;
    --dur-med: 320ms;
    --dur-slow: 700ms;

    --taskbar-h: 60px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }

  *,*::before,*::after{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    background: var(--void-950);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--text-hi);
    -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3,.font-display{ font-family: 'Space Grotesk', 'Inter', sans-serif; letter-spacing: -0.01em; }
  button{ font-family: inherit; }
  ::selection{ background: rgba(139,107,255,0.35); color:#fff; }

  a, button{ -webkit-tap-highlight-color: transparent; }

  /* Focus visibility (accessibility floor) */
  button:focus-visible, [tabindex]:focus-visible, .icon:focus-visible{
    outline: 2px solid var(--accent-blue);
    outline-offset: 2px;
    border-radius: var(--radius-sm);
  }

  /* ==========================================================================
     BOOT SEQUENCE - one orchestrated entrance, plays once per load
     ========================================================================== */
  #boot-screen{
    position:fixed; inset:0; z-index:9999;
    background: radial-gradient(ellipse at 50% 40%, #10152a 0%, #06070d 70%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:22px;
    animation: boot-fade 900ms var(--ease-out) 1900ms forwards;
  }
  @keyframes boot-fade{ to{ opacity:0; visibility:hidden; pointer-events:none; } }

  .boot-mark{ width:74px; height:74px; opacity:0; transform: scale(.85);
    animation: boot-mark-in 900ms var(--ease-out) 150ms forwards; }
  @keyframes boot-mark-in{ to{ opacity:1; transform:scale(1); } }

  .boot-ring{ transform-origin:50% 50%; animation: boot-spin 1600ms linear infinite; opacity:.85; }
  @keyframes boot-spin{ to{ transform:rotate(360deg);} }

  .boot-word{
    font-family:'Space Grotesk',sans-serif; font-size:15px; letter-spacing:0.32em;
    color: var(--text-low); text-transform:uppercase;
    opacity:0; animation: boot-word-in 700ms var(--ease-out) 550ms forwards;
  }
  @keyframes boot-word-in{ to{ opacity:1; } }

  .boot-bar{ width:160px; height:2px; border-radius:2px; background: rgba(255,255,255,0.08); overflow:hidden; opacity:0;
    animation: boot-word-in 500ms var(--ease-out) 750ms forwards; }
  .boot-bar::after{ content:''; display:block; height:100%; width:40%; border-radius:2px;
    background: var(--accent-grad); animation: boot-bar-run 1100ms var(--ease-out) 800ms forwards; }
  @keyframes boot-bar-run{ from{ transform: translateX(-100%);} to{ transform: translateX(250%);} }

  /* ==========================================================================
     DESKTOP + WALLPAPER
     ========================================================================== */
  #desktop{
    position:fixed; inset:0; overflow:hidden;
    padding-bottom: var(--taskbar-h);
  }

  #wallpaper{
    position:absolute; inset:0; z-index:0;
    background: var(--wp-base, radial-gradient(1200px 700px at 15% 10%, #1a2140 0%, transparent 60%));
    transition: background 600ms var(--ease-out);
  }
  #wallpaper .wp-layer{ position:absolute; inset:-10%; }
  #wallpaper .orb{
    position:absolute; border-radius:50%; filter: blur(70px); opacity:.55; will-change: transform;
  }
  .orb-1{ width:38vw; height:38vw; top:-8%; left:-6%; background: radial-gradient(circle at 30% 30%, var(--accent-violet), transparent 70%);
    animation: drift-a 26s ease-in-out infinite alternate; }
  .orb-2{ width:32vw; height:32vw; bottom:-10%; right:-5%; background: radial-gradient(circle at 60% 40%, var(--accent-blue), transparent 70%);
    animation: drift-b 32s ease-in-out infinite alternate; }
  .orb-3{ width:22vw; height:22vw; top:35%; right:18%; background: radial-gradient(circle at 50% 50%, #6f5cff, transparent 70%);
    opacity:.35; animation: drift-c 24s ease-in-out infinite alternate; }
  @keyframes drift-a{ from{ transform: translate(0,0);} to{ transform: translate(4%, 6%);} }
  @keyframes drift-b{ from{ transform: translate(0,0);} to{ transform: translate(-5%, -4%);} }
  @keyframes drift-c{ from{ transform: translate(0,0) scale(1);} to{ transform: translate(-3%, 5%) scale(1.08);} }

  #wallpaper .grain{
    position:absolute; inset:0; opacity:.05; mix-blend-mode: overlay; pointer-events:none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
  #wallpaper .vignette{ position:absolute; inset:0; background: radial-gradient(ellipse at 50% 55%, transparent 45%, rgba(0,0,0,0.55) 100%); }

  /* ==========================================================================
     DESKTOP ICONS
     ========================================================================== */
  #icons-layer{
    position:absolute; inset:0; z-index:1;
    padding: 22px;
  }
  .icon{
    position:absolute;
    width:88px; height:96px;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    padding:10px 6px 8px;
    border-radius: var(--radius-md);
    border:1px solid transparent;
    background: transparent;
    cursor:default;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
    color: var(--text-hi);
  }
  .icon:hover{ background: rgba(255,255,255,0.045); }
  .icon.selected{ background: rgba(120,140,255,0.14); border-color: rgba(140,150,255,0.30); }
  .icon.dragging{ z-index:5; background: rgba(120,140,255,0.16); }

  .icon-glyph{
    width:46px; height:46px; border-radius: 13px;
    display:flex; align-items:center; justify-content:center;
    background: var(--glass-fill);
    border:1px solid var(--glass-border-soft);
    backdrop-filter: blur(8px);
    box-shadow: 0 6px 18px rgba(0,0,0,0.25);
    transition: transform var(--dur-fast) var(--ease-out);
  }
  .icon:active .icon-glyph{ transform: scale(0.94); }
  .icon-glyph svg{ width:24px; height:24px; stroke: var(--text-hi); }

  .icon-label{
    font-size:12px; line-height:1.25; text-align:center;
    color: var(--text-hi);
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    max-width:82px;
    display:-webkit-box; -webkit-line-clamp:2; line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }

  /* marquee selection box */
  #select-box{
    position:absolute; z-index:2; display:none;
    border:1px solid rgba(139,107,255,0.6);
    background: rgba(139,107,255,0.12);
    border-radius:3px;
  }

  /* ==========================================================================
     GLASS PANEL (shared: context menus, about panel, popovers)
     ========================================================================== */
  .glass-panel{
    background: linear-gradient(180deg, rgba(24,28,46,0.78), rgba(15,18,32,0.78));
    backdrop-filter: blur(var(--blur-glass)) saturate(140%);
    -webkit-backdrop-filter: blur(var(--blur-glass)) saturate(140%);
    border:1px solid var(--glass-border);
    box-shadow: var(--shadow-soft);
    border-radius: var(--radius-md);
  }

  .context-menu{
    position:fixed; z-index:50;
    min-width:220px;
    padding:6px;
    transform-origin: top left;
    animation: menu-in var(--dur-fast) var(--ease-out);
  }
  @keyframes menu-in{ from{ opacity:0; transform: scale(0.96) translateY(-4px);} to{ opacity:1; transform:none; } }
  .menu-item{
    display:flex; align-items:center; gap:10px;
    width:100%; text-align:left;
    padding:9px 10px; border-radius: var(--radius-sm);
    background:none; border:none; color: var(--text-hi);
    font-size:13.5px; cursor:default;
  }
  .menu-item:hover, .menu-item:focus-visible{ background: var(--glass-fill-strong); outline:none; }
  .menu-item svg{ width:16px; height:16px; stroke: var(--text-mid); flex-shrink:0; }
  .menu-item .kbd{ margin-left:auto; font-size:11px; color: var(--text-low); }
  .menu-sep{ height:1px; margin:6px 4px; background: var(--glass-border-soft); }
  .menu-item[disabled]{ opacity:.4; }

  .swatch-row{ display:flex; gap:8px; padding:8px 10px 4px; }
  .swatch{ width:26px; height:26px; border-radius:9px; border:1.5px solid rgba(255,255,255,0.18); cursor:default; }
  .swatch.active{ border-color:#fff; box-shadow: 0 0 0 2px rgba(255,255,255,0.15); }

  /* ==========================================================================
     ABOUT PANEL
     ========================================================================== */
  #about-panel{
    position:fixed; z-index:60; left:50%; top:50%;
    transform: translate(-50%,-50%) scale(0.96); opacity:0; pointer-events:none;
    width:340px; padding:28px 24px 22px; text-align:center;
    transition: opacity var(--dur-med) var(--ease-out), transform var(--dur-med) var(--ease-out);
  }
  #about-panel.open{ opacity:1; transform:translate(-50%,-50%) scale(1); pointer-events:auto; }
  #about-panel .about-mark{ width:52px; height:52px; margin:0 auto 14px; }
  #about-panel h2{ margin:0 0 4px; font-size:19px; }
  #about-panel .ver{ font-size:12px; color: var(--text-low); margin-bottom:16px; }
  #about-panel p{ font-size:12.5px; color: var(--text-mid); line-height:1.6; margin:0 0 18px; }
  #about-panel button{
    border:1px solid var(--glass-border); background: var(--glass-fill);
    color: var(--text-hi); padding:9px 18px; border-radius:10px; font-size:13px; cursor:default;
  }
  #about-panel button:hover{ background: var(--glass-fill-strong); }
  #scrim{ position:fixed; inset:0; z-index:55; background: rgba(4,5,10,0.4); opacity:0; pointer-events:none; transition: opacity var(--dur-med) var(--ease-out); }
  #scrim.open{ opacity:1; pointer-events:auto; }

  /* ==========================================================================
     TASKBAR
     ========================================================================== */
  #taskbar{
    position:fixed; left:0; right:0; bottom:0; height: var(--taskbar-h);
    z-index:40;
    display:flex; align-items:center; justify-content:space-between;
    padding: 0 10px;
    background: linear-gradient(180deg, rgba(14,17,29,0.55), rgba(9,11,19,0.72));
    backdrop-filter: blur(24px) saturate(150%);
    -webkit-backdrop-filter: blur(24px) saturate(150%);
    border-top:1px solid var(--glass-border-soft);
  }

  #start-btn{
    display:flex; align-items:center; gap:9px;
    height:42px; padding:0 16px 0 10px;
    border-radius: 12px; border:1px solid transparent;
    background:none; color: var(--text-hi); cursor:default;
    transition: background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
  }
  #start-btn:hover{ background: var(--glass-fill); border-color: var(--glass-border-soft); }
  #start-btn.active{ background: var(--glass-fill-strong); border-color: var(--glass-border); }
  #start-btn .mark{ width:22px; height:22px; }
  #start-btn span{ font-family:'Space Grotesk',sans-serif; font-size:13.5px; letter-spacing:0.01em; }

  #task-items{ flex:1; display:flex; align-items:center; gap:6px; height:100%; padding-left:8px; }
  .task-hint{ font-size:12px; color: var(--text-low); }

  #tray{ display:flex; align-items:center; gap:4px; }
  .tray-btn{
    display:flex; align-items:center; justify-content:center;
    width:34px; height:34px; border-radius:10px;
    background:none; border:1px solid transparent; color: var(--text-mid); cursor:default;
  }
  .tray-btn:hover{ background: var(--glass-fill); border-color: var(--glass-border-soft); color: var(--text-hi); }
  .tray-btn svg{ width:17px; height:17px; }
  #tray-battery-pct{ font-size:11px; color: var(--text-mid); margin-left:2px; }

  #clock-btn{
    display:flex; flex-direction:column; align-items:flex-end; justify-content:center;
    padding:4px 12px; border-radius:10px; background:none; border:1px solid transparent;
    color: var(--text-hi); cursor:default; line-height:1.25; margin-left:4px;
  }
  #clock-btn:hover{ background: var(--glass-fill); border-color: var(--glass-border-soft); }
  #clock-time{ font-family:'Space Grotesk',sans-serif; font-size:13px; font-variant-numeric: tabular-nums; }
  #clock-date{ font-size:10.5px; color: var(--text-low); }

  /* ==========================================================================
     POPOVERS (volume / calendar)
     ========================================================================== */
  .popover{
    position:fixed; z-index:50; padding:16px; width:240px;
    opacity:0; transform: translateY(6px) scale(0.98); pointer-events:none;
    transition: opacity var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
  }
  .popover.open{ opacity:1; transform:none; pointer-events:auto; }
  .popover h3{ margin:0 0 12px; font-size:12.5px; color: var(--text-mid); font-weight:600; }

  #volume-popover input[type=range]{
    width:100%; appearance:none; height:4px; border-radius:3px;
    background: rgba(255,255,255,0.12); outline:none;
  }
  #volume-popover input[type=range]::-webkit-slider-thumb{
    appearance:none; width:14px; height:14px; border-radius:50%;
    background: var(--accent-grad); cursor:default; box-shadow:0 2px 6px rgba(0,0,0,0.4);
  }
  #volume-val{ font-size:11px; color: var(--text-low); margin-top:8px; text-align:right; }

  #calendar-popover{ width:260px; text-align:center; }
  #cal-month{ font-family:'Space Grotesk',sans-serif; font-size:13.5px; margin-bottom:10px; }
  #cal-grid{ display:grid; grid-template-columns: repeat(7,1fr); gap:4px; font-size:11px; color: var(--text-mid); }
  #cal-grid .dow{ color: var(--text-low); font-size:10px; padding-bottom:4px; }
  #cal-grid .day{ padding:5px 0; border-radius:6px; }
  #cal-grid .day.today{ background: var(--accent-grad); color:#fff; font-weight:600; }
  #cal-grid .day.pad{ opacity:0; }

  /* ==========================================================================
     TOASTS
     ========================================================================== */
  #toast-container{
    position:fixed; right:16px; bottom: calc(var(--taskbar-h) + 14px); z-index:80;
    display:flex; flex-direction:column; gap:8px; align-items:flex-end;
    pointer-events:none;
  }
  .toast{
    display:flex; align-items:center; gap:10px;
    padding:12px 14px; max-width:300px;
    background: linear-gradient(180deg, rgba(24,28,46,0.9), rgba(15,18,32,0.9));
    border:1px solid var(--glass-border); border-radius:12px;
    box-shadow: var(--shadow-soft);
    backdrop-filter: blur(16px);
    font-size:12.5px; color: var(--text-hi);
    animation: toast-in 260ms var(--ease-out);
  }
  .toast.leaving{ animation: toast-out 220ms var(--ease-out) forwards; }
  @keyframes toast-in{ from{ opacity:0; transform: translateX(16px);} to{ opacity:1; transform:none; } }
  @keyframes toast-out{ to{ opacity:0; transform: translateX(16px) scale(0.98);} }
  .toast .dot{ width:7px; height:7px; border-radius:50%; background: var(--accent-grad); flex-shrink:0; }

  /* Utility */
  [hidden]{ display:none !important; }
</style>
</head>
<body>

  <!-- BOOT -->
  <div id="boot-screen" aria-hidden="true">
    <svg class="boot-mark" viewBox="0 0 64 64" fill="none">
      <defs>
        <linearGradient id="bootGrad" x1="0" y1="0" x2="64" y2="64">
          <stop offset="0" stop-color="#4f8dff"/>
          <stop offset="1" stop-color="#8b6bff"/>
        </linearGradient>
      </defs>
      <circle class="boot-ring" cx="32" cy="32" r="27" stroke="url(#bootGrad)" stroke-width="2" stroke-dasharray="8 10" stroke-linecap="round"/>
      <path d="M32 14 L46 46 L38 46 L32 32 L26 46 L18 46 Z" fill="url(#bootGrad)"/>
    </svg>
    <div class="boot-word">Aether OS</div>
    <div class="boot-bar"></div>
  </div>

  <!-- DESKTOP -->
  <main id="desktop" tabindex="-1">
    <div id="wallpaper">
      <div class="wp-layer">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
      </div>
      <div class="grain"></div>
      <div class="vignette"></div>
    </div>

    <div id="icons-layer"></div>
    <div id="select-box"></div>
  </main>

  <div id="scrim"></div>

  <!-- CONTEXT MENUS -->
  <div id="menu-desktop" class="context-menu glass-panel" hidden role="menu"></div>
  <div id="menu-icon" class="context-menu glass-panel" hidden role="menu"></div>

  <!-- ABOUT PANEL -->
  <div id="about-panel" class="glass-panel" role="dialog" aria-label="About Aether OS">
    <svg class="about-mark" viewBox="0 0 64 64" fill="none">
      <defs>
        <linearGradient id="aboutGrad" x1="0" y1="0" x2="64" y2="64">
          <stop offset="0" stop-color="#4f8dff"/><stop offset="1" stop-color="#8b6bff"/>
        </linearGradient>
      </defs>
      <circle cx="32" cy="32" r="27" stroke="url(#aboutGrad)" stroke-width="2" stroke-dasharray="8 10" stroke-linecap="round"/>
      <path d="M32 14 L46 46 L38 46 L32 32 L26 46 L18 46 Z" fill="url(#aboutGrad)"/>
    </svg>
    <h2 class="font-display">Aether OS</h2>
    <div class="ver">Phase 1 · Desktop Shell · Build 0.1.0</div>
    <p>A browser-native desktop environment. Everything you see runs locally - no account, no server, no tracking. Your settings live in this browser only.</p>
    <button id="about-close" type="button">Close</button>
  </div>

  <!-- TASKBAR -->
  <footer id="taskbar">
    <button id="start-btn" type="button" aria-haspopup="true">
      <svg class="mark" viewBox="0 0 64 64" fill="none">
        <defs>
          <linearGradient id="startGrad" x1="0" y1="0" x2="64" y2="64">
            <stop offset="0" stop-color="#4f8dff"/><stop offset="1" stop-color="#8b6bff"/>
          </linearGradient>
        </defs>
        <circle cx="32" cy="32" r="27" stroke="url(#startGrad)" stroke-width="3" stroke-dasharray="8 10" stroke-linecap="round"/>
        <path d="M32 14 L46 46 L38 46 L32 32 L26 46 L18 46 Z" fill="url(#startGrad)"/>
      </svg>
      <span>Start</span>
    </button>

    <div id="task-items">
      <span class="task-hint">Open windows will appear here in Phase 2</span>
    </div>

    <div id="tray">
      <button class="tray-btn" id="tray-wifi" type="button" title="Network: Connected" aria-label="Network status">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.5a17 17 0 0 1 20 0"/><path d="M5.5 12.5a12 12 0 0 1 13 0"/><path d="M9 16.3a7 7 0 0 1 6 0"/><circle cx="12" cy="19.5" r="1" fill="currentColor" stroke="none"/></svg>
      </button>
      <button class="tray-btn" id="tray-volume" type="button" title="Volume" aria-label="Volume" aria-haspopup="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>
      </button>
      <div class="tray-btn" id="tray-battery" title="Battery" aria-label="Battery status" style="width:auto; gap:3px; padding:0 8px;">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="17" height="10" rx="2"/><path d="M22 10v4" stroke="none" fill="currentColor"/><rect x="4" y="9" width="11" height="6" rx="1" fill="currentColor" stroke="none" id="battery-fill"/></svg>
        <span id="tray-battery-pct"></span>
      </div>
      <button id="clock-btn" type="button" aria-haspopup="true">
        <span id="clock-time">--:--</span>
        <span id="clock-date">--- --</span>
      </button>
    </div>
  </footer>

  <!-- POPOVERS -->
  <div id="volume-popover" class="popover glass-panel" role="dialog" aria-label="Volume">
    <h3>Volume</h3>
    <input type="range" id="volume-range" min="0" max="100" value="70" />
    <div id="volume-val">70%</div>
  </div>

  <div id="calendar-popover" class="popover glass-panel" role="dialog" aria-label="Calendar">
    <div id="cal-month" class="font-display"></div>
    <div id="cal-grid"></div>
  </div>

  <div id="toast-container" aria-live="polite"></div>

<script>
(function(){
"use strict";

/* ============================================================================
   AETHER OS - CORE MODULES
   Kept intentionally modular (IIFE namespaces on `Aether`) so Phase 2+
   (window manager, app framework, virtual filesystem) can hook in cleanly
   without touching this file's internals.
   ========================================================================== */
const Aether = window.Aether = {};

/* ----------------------------------------------------------------------
   Store - thin localStorage wrapper, namespaced. Structured data (files,
   notes, images) will move to IndexedDB in a later phase; this module is
   only for small settings/preferences, per the project's data plan.
   ---------------------------------------------------------------------- */
Aether.Store = (function(){
  const NS = "aether:";
  function get(key, fallback){
    try{
      const raw = localStorage.getItem(NS + key);
      return raw === null ? fallback : JSON.parse(raw);
    }catch(e){ return fallback; }
  }
  function set(key, value){
    try{ localStorage.setItem(NS + key, JSON.stringify(value)); }
    catch(e){ /* storage unavailable or full - fail silently, OS still works */ }
  }
  function remove(key){ try{ localStorage.removeItem(NS + key); }catch(e){} }
  function exportAll(){
    const out = {};
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.indexOf(NS) === 0) out[k.slice(NS.length)] = get(k.slice(NS.length));
    }
    return out;
  }
  function importAll(obj){
    Object.keys(obj || {}).forEach(k => set(k, obj[k]));
  }
  function resetAll(){
    const keys = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.indexOf(NS) === 0) keys.push(k);
    }
    keys.forEach(k => localStorage.removeItem(k));
  }
  return { get, set, remove, exportAll, importAll, resetAll };
})();

/* ----------------------------------------------------------------------
   Toast - lightweight notification pills. Real "Notifications" feature
   (history, actions) arrives in a later phase; this is the primitive.
   ---------------------------------------------------------------------- */
Aether.Toast = (function(){
  const container = document.getElementById("toast-container");
  function show(message, opts){
    opts = opts || {};
    const el = document.createElement("div");
    el.className = "toast";
    el.innerHTML = '<span class="dot"></span><span></span>';
    el.querySelector("span:last-child").textContent = message;
    container.appendChild(el);
    const life = opts.duration || 2600;
    setTimeout(() => {
      el.classList.add("leaving");
      setTimeout(() => el.remove(), 240);
    }, life);
  }
  return { show };
})();

/* ----------------------------------------------------------------------
   Wallpaper - a few preset gradient scenes, cycled from the context menu.
   ---------------------------------------------------------------------- */
Aether.Wallpaper = (function(){
  const presets = [
    { id:"nebula",  css:"radial-gradient(1200px 700px at 15% 10%, #232c52 0%, transparent 60%), radial-gradient(1000px 800px at 85% 90%, #1c2440 0%, transparent 55%), #06070d" },
    { id:"midnight",css:"radial-gradient(1100px 700px at 80% 15%, #1a1f38 0%, transparent 55%), radial-gradient(900px 900px at 10% 95%, #141a30 0%, transparent 60%), #05060b" },
    { id:"aurora",  css:"radial-gradient(1000px 650px at 20% 20%, #26325c 0%, transparent 55%), radial-gradient(1200px 900px at 90% 80%, #24254a 0%, transparent 55%), #07080f" },
    { id:"eclipse", css:"radial-gradient(900px 900px at 50% 30%, #202444 0%, transparent 60%), #060710" }
  ];
  const root = document.getElementById("wallpaper");
  let idx = 0;
  function apply(i){
    idx = ((i % presets.length) + presets.length) % presets.length;
    root.style.setProperty("--wp-base", presets[idx].css);
    root.style.background = presets[idx].css;
    Aether.Store.set("wallpaper", presets[idx].id);
  }
  function next(){
    apply(idx + 1);
    Aether.Toast.show("Wallpaper changed");
  }
  function init(){
    const saved = Aether.Store.get("wallpaper", presets[0].id);
    const i = presets.findIndex(p => p.id === saved);
    apply(i === -1 ? 0 : i);
  }
  return { init, next, presets: presets.map(p=>p.id) };
})();

/* ----------------------------------------------------------------------
   Icons - desktop launcher icons. Draggable, selectable, position saved.
   Opening an app is stubbed until the window manager (Phase 2) exists.
   ---------------------------------------------------------------------- */
Aether.Icons = (function(){
  const layer = document.getElementById("icons-layer");
  const APPS = [
    { id:"files",    label:"File Manager",   glyph:"folder" },
    { id:"terminal", label:"Terminal",       glyph:"terminal" },
    { id:"notes",    label:"Notes",          glyph:"note" },
    { id:"photos",   label:"Photos",         glyph:"photo" },
    { id:"browser",  label:"Browser",        glyph:"compass" },
    { id:"settings", label:"Settings",       glyph:"settings" },
    { id:"monitor",  label:"System Monitor", glyph:"gauge" }
  ];

  const GRID_X = 96, GRID_Y = 104, PAD = 22;
  let selected = null;

  function defaultPositions(){
    const pos = {};
    APPS.forEach((app, i) => {
      pos[app.id] = { col: 0, row: i };
    });
    return pos;
  }

  function render(){
    const saved = Aether.Store.get("iconPositions", defaultPositions());
    layer.innerHTML = "";
    APPS.forEach(app => {
      const p = saved[app.id] || { col:0, row:0 };
      const el = document.createElement("div");
      el.className = "icon";
      el.tabIndex = 0;
      el.dataset.app = app.id;
      el.style.left = (PAD + p.col * GRID_X) + "px";
      el.style.top  = (PAD + p.row * GRID_Y) + "px";
      el.innerHTML =
        '<div class="icon-glyph">'+ svg(app.glyph) +'</div>'+
        '<div class="icon-label">'+ app.label +'</div>';
      layer.appendChild(el);
      makeDraggable(el, app.id, saved);
    });
  }

  function select(el){
    if(selected) selected.classList.remove("selected");
    selected = el;
    if(el) el.classList.add("selected");
  }

  function openApp(id, label){
    Aether.Toast.show((label || id) + " - arrives in Phase 2 (window manager & apps)");
  }

  function makeDraggable(el, id, savedPositions){
    let dragging = false, moved = false;
    let startX=0, startY=0, origLeft=0, origTop=0;

    el.addEventListener("pointerdown", (e) => {
      if(e.button !== 0) return;
      select(el);
      dragging = true; moved = false;
      startX = e.clientX; startY = e.clientY;
      origLeft = el.offsetLeft; origTop = el.offsetTop;
      el.setPointerCapture(e.pointerId);
    });

    el.addEventListener("pointermove", (e) => {
      if(!dragging) return;
      const dx = e.clientX - startX, dy = e.clientY - startY;
      if(Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
      if(!moved) return;
      el.classList.add("dragging");
      const desktop = document.getElementById("desktop");
      const maxLeft = desktop.clientWidth - el.offsetWidth - 4;
      const maxTop  = desktop.clientHeight - el.offsetHeight - 4;
      el.style.left = Math.max(4, Math.min(maxLeft, origLeft + dx)) + "px";
      el.style.top  = Math.max(4, Math.min(maxTop, origTop + dy)) + "px";
    });

    el.addEventListener("pointerup", (e) => {
      if(!dragging) return;
      dragging = false;
      el.classList.remove("dragging");
      if(moved){
        // snap to nearest grid cell
        const col = Math.round((el.offsetLeft - PAD) / GRID_X);
        const row = Math.round((el.offsetTop - PAD) / GRID_Y);
        el.style.left = (PAD + Math.max(0,col) * GRID_X) + "px";
        el.style.top  = (PAD + Math.max(0,row) * GRID_Y) + "px";
        savedPositions[id] = { col: Math.max(0,col), row: Math.max(0,row) };
        Aether.Store.set("iconPositions", savedPositions);
      } else {
        // treat as click -> double-click detection
        const now = Date.now();
        if(el._lastClick && now - el._lastClick < 380){
          const app = APPS.find(a => a.id === id);
          openApp(id, app && app.label);
        }
        el._lastClick = now;
      }
    });

    el.addEventListener("keydown", (e) => {
      if(e.key === "Enter"){
        const app = APPS.find(a => a.id === id);
        openApp(id, app && app.label);
      }
    });

    el.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      select(el);
      Aether.ContextMenu.openIconMenu(e.clientX, e.clientY, id);
    });
  }

  function autoArrange(){
    const pos = defaultPositions();
    Aether.Store.set("iconPositions", pos);
    render();
    Aether.Toast.show("Icons arranged");
  }

  function clearSelection(){ select(null); }
  function getApp(id){ return APPS.find(a => a.id === id); }
  function openSelected(id){ const a = getApp(id); openApp(id, a && a.label); }

  return { render, autoArrange, clearSelection, getApp, openApp, openSelected, APPS };
})();

/* ----------------------------------------------------------------------
   ContextMenu - desktop background menu + per-icon menu.
   ---------------------------------------------------------------------- */
Aether.ContextMenu = (function(){
  const desktopMenu = document.getElementById("menu-desktop");
  const iconMenu = document.getElementById("menu-icon");
  const desktop = document.getElementById("desktop");

  function item(label, glyphName, onClick, extraHTML){
    const btn = document.createElement("button");
    btn.className = "menu-item";
    btn.type = "button";
    btn.setAttribute("role","menuitem");
    btn.innerHTML = svg(glyphName) + "<span>"+label+"</span>" + (extraHTML||"");
    btn.addEventListener("click", () => { close(); onClick && onClick(); });
    return btn;
  }
  function sep(){ const d = document.createElement("div"); d.className="menu-sep"; return d; }

  function place(menu, x, y){
    menu.hidden = false;
    const r = menu.getBoundingClientRect();
    const vw = window.innerWidth, vh = window.innerHeight - 60; // stay above taskbar
    menu.style.left = Math.min(x, vw - r.width - 8) + "px";
    menu.style.top  = Math.min(y, vh - r.height - 8) + "px";
  }

  function close(){
    desktopMenu.hidden = true;
    iconMenu.hidden = true;
  }

  function openDesktopMenu(x, y){
    close();
    desktopMenu.innerHTML = "";
    desktopMenu.appendChild(item("New Folder", "folder", () => {
      Aether.Toast.show("New Folder - connects to the virtual filesystem in Phase 2");
    }));
    desktopMenu.appendChild(item("Refresh", "refresh", () => {
      Aether.Icons.render();
      Aether.Toast.show("Desktop refreshed");
    }));
    desktopMenu.appendChild(item("Auto-arrange Icons", "arrange", Aether.Icons.autoArrange));
    desktopMenu.appendChild(sep());
    desktopMenu.appendChild(item("Next Wallpaper", "wallpaper", Aether.Wallpaper.next));
    desktopMenu.appendChild(item("Display Settings", "monitor", () => {
      Aether.Toast.show("Display Settings - arrives with the Settings app");
    }));
    desktopMenu.appendChild(sep());
    desktopMenu.appendChild(item("About Aether OS", "info", Aether.About.open));
    place(desktopMenu, x, y);
  }

  function openIconMenu(x, y, appId){
    close();
    const app = Aether.Icons.getApp(appId);
    iconMenu.innerHTML = "";
    iconMenu.appendChild(item("Open", "open", () => Aether.Icons.openSelected(appId)));
    iconMenu.appendChild(item("Pin to Taskbar", "pin", () => {
      Aether.Toast.show("Pinning arrives with the taskbar app system in Phase 2");
    }));
    iconMenu.appendChild(sep());
    iconMenu.appendChild(item("Properties", "info", () => {
      Aether.Toast.show((app ? app.label : "This item") + " - properties arrive with the file manager");
    }));
    place(iconMenu, x, y);
  }

  desktop.addEventListener("contextmenu", (e) => {
    if(e.target.closest(".icon")) return; // handled by icon's own listener
    e.preventDefault();
    Aether.Icons.clearSelection();
    openDesktopMenu(e.clientX, e.clientY);
  });

  document.addEventListener("pointerdown", (e) => {
    if(!e.target.closest(".context-menu")) close();
  });
  window.addEventListener("blur", close);
  document.addEventListener("keydown", (e) => { if(e.key === "Escape") close(); });

  return { openIconMenu, openDesktopMenu, close };
})();

/* ----------------------------------------------------------------------
   Marquee selection - drag on empty desktop to select multiple icons
   (visual only for now; multi-select actions arrive with the file manager)
   ---------------------------------------------------------------------- */
(function(){
  const desktop = document.getElementById("desktop");
  const box = document.getElementById("select-box");
  let active = false, sx=0, sy=0;

  desktop.addEventListener("pointerdown", (e) => {
    if(e.button !== 0) return;
    if(e.target.closest(".icon") || e.target.closest(".context-menu")) return;
    active = true; sx = e.clientX; sy = e.clientY;
    box.style.left = sx+"px"; box.style.top = sy+"px";
    box.style.width = "0px"; box.style.height = "0px";
    box.style.display = "block";
    Aether.Icons.clearSelection();
  });
  desktop.addEventListener("pointermove", (e) => {
    if(!active) return;
    const x = Math.min(e.clientX, sx), y = Math.min(e.clientY, sy);
    const w = Math.abs(e.clientX - sx), h = Math.abs(e.clientY - sy);
    box.style.left = x+"px"; box.style.top = y+"px";
    box.style.width = w+"px"; box.style.height = h+"px";
  });
  window.addEventListener("pointerup", () => {
    if(!active) return;
    active = false;
    box.style.display = "none";
  });
})();

/* ----------------------------------------------------------------------
   About panel
   ---------------------------------------------------------------------- */
Aether.About = (function(){
  const panel = document.getElementById("about-panel");
  const scrim = document.getElementById("scrim");
  function open(){ panel.classList.add("open"); scrim.classList.add("open"); }
  function close(){ panel.classList.remove("open"); scrim.classList.remove("open"); }
  document.getElementById("about-close").addEventListener("click", close);
  scrim.addEventListener("click", close);
  document.addEventListener("keydown", (e) => { if(e.key === "Escape") close(); });
  return { open, close };
})();

/* ----------------------------------------------------------------------
   Clock + Calendar popover
   ---------------------------------------------------------------------- */
Aether.Clock = (function(){
  const timeEl = document.getElementById("clock-time");
  const dateEl = document.getElementById("clock-date");
  const btn = document.getElementById("clock-btn");
  const pop = document.getElementById("calendar-popover");

  function tick(){
    const d = new Date();
    let h = d.getHours(); const ampm = h >= 12 ? "PM" : "AM";
    h = h % 12; if(h === 0) h = 12;
    const m = String(d.getMinutes()).padStart(2,"0");
    timeEl.textContent = h + ":" + m + " " + ampm;
    dateEl.textContent = d.toLocaleDateString(undefined, { weekday:"short", month:"short", day:"numeric" });
  }

  function renderCalendar(){
    const d = new Date();
    const monthEl = document.getElementById("cal-month");
    const grid = document.getElementById("cal-grid");
    monthEl.textContent = d.toLocaleDateString(undefined, { month:"long", year:"numeric" });
    grid.innerHTML = "";
    ["S","M","T","W","T","F","S"].forEach(dow => {
      const s = document.createElement("div"); s.className="dow"; s.textContent=dow; grid.appendChild(s);
    });
    const first = new Date(d.getFullYear(), d.getMonth(), 1);
    const startPad = first.getDay();
    const daysInMonth = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    for(let i=0;i<startPad;i++){
      const p = document.createElement("div"); p.className="day pad"; grid.appendChild(p);
    }
    for(let day=1; day<=daysInMonth; day++){
      const cell = document.createElement("div");
      cell.className = "day" + (day === d.getDate() ? " today" : "");
      cell.textContent = day;
      grid.appendChild(cell);
    }
  }

  function toggle(){
    const isOpen = pop.classList.contains("open");
    Aether.Popovers.closeAll();
    if(isOpen) return;
    renderCalendar();
    Aether.Popovers.openNear(pop, btn);
  }

  btn.addEventListener("click", toggle);

  function init(){ tick(); setInterval(tick, 15000); }
  return { init };
})();

/* ----------------------------------------------------------------------
   Popovers helper - shared positioning + exclusive open/close
   ---------------------------------------------------------------------- */
Aether.Popovers = (function(){
  const all = [
    document.getElementById("volume-popover"),
    document.getElementById("calendar-popover")
  ];
  function closeAll(){ all.forEach(p => p.classList.remove("open")); }
  function openNear(pop, anchorEl){
    const r = anchorEl.getBoundingClientRect();
    pop.style.right = (window.innerWidth - r.right) + "px";
    pop.style.bottom = (window.innerHeight - r.top + 10) + "px";
    pop.style.left = "auto"; pop.style.top = "auto";
    pop.classList.add("open");
  }
  document.addEventListener("pointerdown", (e) => {
    if(e.target.closest(".popover") || e.target.closest("#tray-volume") || e.target.closest("#clock-btn")) return;
    closeAll();
  });
  document.addEventListener("keydown", (e) => { if(e.key === "Escape") closeAll(); });
  return { closeAll, openNear };
})();

/* ----------------------------------------------------------------------
   Tray - wifi (static), volume (functional slider + storage), battery
   ---------------------------------------------------------------------- */
Aether.Tray = (function(){
  const volBtn = document.getElementById("tray-volume");
  const volPop = document.getElementById("volume-popover");
  const volRange = document.getElementById("volume-range");
  const volVal = document.getElementById("volume-val");
  const battPct = document.getElementById("tray-battery-pct");
  const battFill = document.getElementById("battery-fill");
  const battWrap = document.getElementById("tray-battery");

  function initVolume(){
    const saved = Aether.Store.get("volume", 70);
    volRange.value = saved;
    volVal.textContent = saved + "%";
    volRange.addEventListener("input", () => {
      volVal.textContent = volRange.value + "%";
      Aether.Store.set("volume", Number(volRange.value));
    });
    volBtn.addEventListener("click", () => {
      const isOpen = volPop.classList.contains("open");
      Aether.Popovers.closeAll();
      if(!isOpen) Aether.Popovers.openNear(volPop, volBtn);
    });
  }

  function initBattery(){
    if(!("getBattery" in navigator)){ battWrap.style.display = "none"; return; }
    navigator.getBattery().then(bat => {
      function update(){
        const pct = Math.round(bat.level * 100);
        battPct.textContent = pct + "%";
        battFill.setAttribute("width", Math.max(1, Math.round(11 * bat.level)));
      }
      update();
      bat.addEventListener("levelchange", update);
      bat.addEventListener("chargingchange", update);
    }).catch(() => { battWrap.style.display = "none"; });
  }

  function initWifi(){
    const btn = document.getElementById("tray-wifi");
    btn.addEventListener("click", () => {
      Aether.Toast.show(navigator.onLine === false ? "No network connection" : "Network: Connected");
    });
  }

  function init(){ initVolume(); initBattery(); initWifi(); }
  return { init };
})();

/* ----------------------------------------------------------------------
   Start button - stub until the app launcher (Phase 2) exists
   ---------------------------------------------------------------------- */
(function(){
  const btn = document.getElementById("start-btn");
  btn.addEventListener("click", () => {
    btn.classList.add("active");
    Aether.Toast.show("Start menu arrives in Phase 2");
    setTimeout(() => btn.classList.remove("active"), 220);
  });
})();

/* ----------------------------------------------------------------------
   Boot
   ---------------------------------------------------------------------- */
function init(){
  Aether.Wallpaper.init();
  Aether.Icons.render();
  Aether.Clock.init();
  Aether.Tray.init();

  window.addEventListener("resize", () => {
    // keep icons within bounds on resize (simple re-clamp)
    document.querySelectorAll(".icon").forEach(el => {
      const desktop = document.getElementById("desktop");
      const maxLeft = desktop.clientWidth - el.offsetWidth - 4;
      const maxTop  = desktop.clientHeight - el.offsetHeight - 4;
      el.style.left = Math.max(4, Math.min(maxLeft, el.offsetLeft)) + "px";
      el.style.top  = Math.max(4, Math.min(maxTop, el.offsetTop)) + "px";
    });
  });

  setTimeout(() => {
    document.getElementById("boot-screen").remove();
  }, 2900);
}

document.addEventListener("DOMContentLoaded", init);
})();
