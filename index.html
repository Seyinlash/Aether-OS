<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>Aether OS</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- BOOT -->
  <div id="boot-screen" aria-hidden="true">
    <svg class="boot-mark" viewBox="0 0 64 64" fill="none">
      <defs>
        <linearGradient id="bootGrad" x1="0" y1="0" x2="64" y2="64">
          <stop offset="0" stop-color="#4f8dff"/>
          <stop offset="1" stop-color="#8b6bff"/>
        </linearGradient>
      </defs>
      <circle class="boot-ring" cx="32" cy="32" r="27" stroke="url(#bootGrad)" stroke-width="2" stroke-dasharray="8 10" stroke-linecap="round"/>
      <path d="M32 14 L46 46 L38 46 L32 32 L26 46 L18 46 Z" fill="url(#bootGrad)"/>
    </svg>
    <div class="boot-word">Aether OS</div>
    <div class="boot-bar"></div>
  </div>

  <!-- DESKTOP -->
  <main id="desktop" tabindex="-1">
    <div id="wallpaper">
      <div class="wp-layer">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
      </div>
      <div class="grain"></div>
      <div class="vignette"></div>
    </div>

    <div id="icons-layer"></div>
    <div id="select-box"></div>
  </main>

  <div id="scrim"></div>

  <!-- CONTEXT MENUS -->
  <div id="menu-desktop" class="context-menu glass-panel" hidden role="menu"></div>
  <div id="menu-icon" class="context-menu glass-panel" hidden role="menu"></div>

  <!-- ABOUT PANEL -->
  <div id="about-panel" class="glass-panel" role="dialog" aria-label="About Aether OS">
    <svg class="about-mark" viewBox="0 0 64 64" fill="none">
      <defs>
        <linearGradient id="aboutGrad" x1="0" y1="0" x2="64" y2="64">
          <stop offset="0" stop-color="#4f8dff"/><stop offset="1" stop-color="#8b6bff"/>
        </linearGradient>
      </defs>
      <circle cx="32" cy="32" r="27" stroke="url(#aboutGrad)" stroke-width="2" stroke-dasharray="8 10" stroke-linecap="round"/>
      <path d="M32 14 L46 46 L38 46 L32 32 L26 46 L18 46 Z" fill="url(#aboutGrad)"/>
    </svg>
    <h2 class="font-display">Aether OS</h2>
    <div class="ver">Phase 1 · Desktop Shell · Build 0.1.0</div>
    <p>A browser-native desktop environment. Everything you see runs locally - no account, no server, no tracking. Your settings live in this browser only.</p>
    <button id="about-close" type="button">Close</button>
  </div>

  <!-- TASKBAR -->
  <footer id="taskbar">
    <button id="start-btn" type="button" aria-haspopup="true">
      <svg class="mark" viewBox="0 0 64 64" fill="none">
        <defs>
          <linearGradient id="startGrad" x1="0" y1="0" x2="64" y2="64">
            <stop offset="0" stop-color="#4f8dff"/><stop offset="1" stop-color="#8b6bff"/>
          </linearGradient>
        </defs>
        <circle cx="32" cy="32" r="27" stroke="url(#startGrad)" stroke-width="3" stroke-dasharray="8 10" stroke-linecap="round"/>
        <path d="M32 14 L46 46 L38 46 L32 32 L26 46 L18 46 Z" fill="url(#startGrad)"/>
      </svg>
      <span>Start</span>
    </button>

    <div id="task-items">
      <span class="task-hint">No open windows</span>
    </div>

    <div id="tray">
      <button class="tray-btn" id="tray-wifi" type="button" title="Network: Connected" aria-label="Network status">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.5a17 17 0 0 1 20 0"/><path d="M5.5 12.5a12 12 0 0 1 13 0"/><path d="M9 16.3a7 7 0 0 1 6 0"/><circle cx="12" cy="19.5" r="1" fill="currentColor" stroke="none"/></svg>
      </button>
      <button class="tray-btn" id="tray-volume" type="button" title="Volume" aria-label="Volume" aria-haspopup="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>
      </button>
      <div class="tray-btn" id="tray-battery" title="Battery" aria-label="Battery status" style="width:auto; gap:3px; padding:0 8px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="17" height="10" rx="2"/><path d="M22 10v4" stroke="none" fill="currentColor"/><rect x="4" y="9" width="11" height="6" rx="1" fill="currentColor" stroke="none" id="battery-fill"/></svg>
        <span id="tray-battery-pct"></span>
      </div>
      <button id="clock-btn" type="button" aria-haspopup="true">
        <span id="clock-time">--:--</span>
        <span id="clock-date">--- --</span>
      </button>
    </div>
  </footer>

  <!-- POPOVERS -->
  <div id="volume-popover" class="popover glass-panel" role="dialog" aria-label="Volume">
    <h3>Volume</h3>
    <input type="range" id="volume-range" min="0" max="100" value="70" />
    <div id="volume-val">70%</div>
  </div>

  <div id="calendar-popover" class="popover glass-panel" role="dialog" aria-label="Calendar">
    <div id="cal-month" class="font-display"></div>
    <div id="cal-grid"></div>
  </div>

  <div id="toast-container" aria-live="polite"></div>

<script src="desktop.js" defer></script>
<script src="window-manager.js" defer></script>
<script src="applications.js" defer></script>
<script src="start-menu.js" defer></script>
</body>
</html>
